
services:
  db:
    image: postgres:16-alpine
    container_name: prime-crm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in an ignored .env file}
      POSTGRES_DB: ${POSTGRES_DB:-primecrm}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prime} -d ${POSTGRES_DB:-primecrm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prime-net

  redis:
    image: redis:7-alpine
    container_name: prime-crm-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - prime-net

  backend:
    build: ./backend
    container_name: prime-crm-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-prime}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in an ignored .env file}@db:5432/${POSTGRES_DB:-primecrm}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in an ignored .env file}
      FIRST_SUPERUSER_EMAIL: ${FIRST_SUPERUSER_EMAIL:-}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:-}
      FIRST_COMPANY_NAME: ${FIRST_COMPANY_NAME:-Prime Vision Solutions}
      ALLOW_PUBLIC_REGISTRATION: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - prime-net
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    command: >
      sh -c "alembic upgrade head && python -m app.bootstrap && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build: ./frontend
    container_name: prime-crm-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-80}:80"
    networks:
      - prime-net

volumes:
  pgdata:
  redisdata:
  backend_uploads:

networks:
  prime-net:
    driver: bridge
