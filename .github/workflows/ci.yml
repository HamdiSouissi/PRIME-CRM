name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# The CI and Render hook require no repository-write permissions.
permissions:
  contents: read

jobs:
  backend:
    name: Backend · Python 3.11 / PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Cancel stale tests without cancelling a Render request already underway.
    concurrency:
      group: ci-${{ github.workflow }}-backend-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: primecrm_ci
          POSTGRES_USER: ci
          # Disposable container credential, not an application secret.
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U ci -d primecrm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Test release guards with fictitious data (no production access)
        working-directory: .
        run: python -m unittest discover -s tools/tests -p 'test_*.py' -v

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Lint Python
        run: python -m ruff check app alembic

      - name: Test backend (SQLite and disposable Redis)
        env:
          DATABASE_URL: 'sqlite:///:memory:'
          CI_TEST_REDIS_URL: redis://127.0.0.1:${{ job.services.redis.ports['6379'] }}/0
        run: python -m pytest -q app/tests

      - name: Compile Python
        run: python -m compileall -q app alembic

      - name: Test migrations on disposable PostgreSQL
        # This URL always points to the service container above, never Neon.
        env:
          DATABASE_URL: postgresql://ci:ci-only-password@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/primecrm_ci
        run: |
          # The CLI operates only on the disposable service container.
          # Preserve an old-format account through the additive session migration.
          alembic upgrade 20261028_01
          python - <<'PY'
          import os
          import psycopg2
          with psycopg2.connect(os.environ['DATABASE_URL']) as connection:
              with connection.cursor() as cursor:
                  cursor.execute("INSERT INTO companies (name, slug) VALUES ('CI migration', 'ci-migration') RETURNING id")
                  company_id = cursor.fetchone()[0]
                  cursor.execute("INSERT INTO users (company_id, email, hashed_password, first_name, last_name, role, is_active) VALUES (%s, %s, %s, %s, %s, %s, %s)", (company_id, 'old-format@example.com', 'fictitious-hash', 'Old', 'User', 'viewer', True))
          PY
          alembic upgrade head
          python - <<'PY'
          import os
          import psycopg2
          with psycopg2.connect(os.environ['DATABASE_URL']) as connection:
              with connection.cursor() as cursor:
                  cursor.execute("SELECT hashed_password, session_nonce FROM users WHERE email = %s", ('old-format@example.com',))
                  assert cursor.fetchone() == ('fictitious-hash', None)
          PY
          alembic upgrade head
          alembic check
          # Destructive: this database is discarded at the end of the job.
          alembic downgrade base
          alembic upgrade head
          alembic check

      - name: Test AI credential encryption on disposable PostgreSQL
        # Loopback service container only; fake keys and a mocked AI provider.
        env:
          CI_TEST_POSTGRES_URL: postgresql://ci:ci-only-password@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/primecrm_ci
        run: python -m pytest -q app/tests/test_ai_postgresql.py

      - name: Test concurrent sessions with disposable PostgreSQL and Redis
        # Independent connections and committed rows; only these containers are allowed.
        env:
          CI_TEST_POSTGRES_URL: postgresql://ci:ci-only-password@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/primecrm_ci
          CI_TEST_REDIS_URL: redis://127.0.0.1:${{ job.services.redis.ports['6379'] }}/0
        run: python -m pytest -q app/tests/test_sessions_postgresql.py

      - name: Test private bootstrap on disposable PostgreSQL
        env:
          APP_ENV: production
          DATABASE_URL: postgresql://ci:ci-only-password@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/primecrm_ci
          # The bootstrap validates this placeholder but never connects to it.
          REDIS_URL: rediss://default:ci-only-password@redis.example.invalid:6379/0
          CORS_ORIGINS: https://ci.example.com
          ALLOW_PUBLIC_REGISTRATION: 'false'
          FIRST_SUPERUSER_EMAIL: ci@example.com
          FIRST_COMPANY_NAME: CI Company
        run: |
          # Random values exist only in this runner and are never printed.
          export SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          export FIRST_SUPERUSER_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          python -m app.bootstrap
          unset FIRST_SUPERUSER_EMAIL FIRST_SUPERUSER_PASSWORD
          python -m app.bootstrap
          python - <<'PY'
          import os
          import psycopg2
          with psycopg2.connect(os.environ['DATABASE_URL']) as connection:
              with connection.cursor() as cursor:
                  for table, expected in [('users', 1), ('companies', 1), ('pipeline_stages', 8)]:
                      cursor.execute(f'SELECT count(*) FROM {table}')
                      assert cursor.fetchone()[0] == expected
          PY

      - name: Validate Docker Compose configuration
        working-directory: .
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          REDIS_URL: rediss://default:ci-only-password@redis.example.invalid:6379/0
          SECRET_KEY: ci-only-signing-key-with-more-than-thirty-two-characters
          # Syntax check only; no proxy or production ingress is validated here.
          CLIENT_IP_MODE: direct
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.prod.yml config --quiet

      - name: Build backend Docker image
        # Build only: the image stays on the runner and is never pushed.
        run: docker build --tag prime-crm-backend:ci .

  frontend:
    name: Frontend · Node.js 24
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ci-${{ github.workflow }}-frontend-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm run test -- --run

      - name: Validate the production API origin
        # This public URL is compiled into the browser bundle. Pinning it here
        # prevents a misconfigured variable from sending login details elsewhere.
        if: github.event_name == 'push' && github.repository == 'HamdiSouissi/PRIME-CRM' && github.ref == 'refs/heads/arena/a18b007f-prime-crm'
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ "$VITE_API_URL" != 'https://prime-crm-cqi3.onrender.com' ]; then
            echo '::error::Set the repository variable VITE_API_URL to the expected public Render origin.'
            exit 1
          fi

      - name: Type-check and build frontend
        env:
          # Public configuration only; Vite exposes VITE_* values to browsers.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Verify the API origin in the production build
        if: github.event_name == 'push' && github.repository == 'HamdiSouissi/PRIME-CRM' && github.ref == 'refs/heads/arena/a18b007f-prime-crm'
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ] || ! grep -lF -- "$VITE_API_URL" dist/assets/*.js >/dev/null; then
            echo '::error::The expected API origin is missing from the built JavaScript.'
            exit 1
          fi

      - name: Record the tested commit in the build
        if: github.event_name == 'push' && github.repository == 'HamdiSouissi/PRIME-CRM' && github.ref == 'refs/heads/arena/a18b007f-prime-crm'
        run: |
          if ! [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Invalid commit SHA; no frontend build information was created.'
            exit 1
          fi
          printf '{"commit":"%s"}\n' "$GITHUB_SHA" > dist/build-info.json

      - name: Verify static hosting rules
        run: |
          test "$(cat dist/_redirects)" = '/* /index.html 200'
          grep -Fx "  X-Frame-Options: DENY" dist/_headers
          grep -Fx "  Content-Security-Policy: frame-ancestors 'none'" dist/_headers
          grep -Fx "  X-Content-Type-Options: nosniff" dist/_headers
          grep -Fx "  Referrer-Policy: strict-origin-when-cross-origin" dist/_headers
          grep -Fx '/build-info.json' dist/_headers
          grep -Fx '  Cache-Control: no-store' dist/_headers

      - name: Build frontend Docker image
        # Build only: the image stays on the runner and is never pushed.
        run: docker build --tag prime-crm-frontend:ci .

      - name: Check nginx configuration
        # Temporary container, no published ports and no application traffic.
        run: docker run --rm --add-host backend:127.0.0.1 prime-crm-frontend:ci nginx -t

  frontend_release_preview:
    name: Frontend · répétition protégée sans publication
    # A deliberately marked push runs this one-time rehearsal. It never calls
    # Netlify or receives a Netlify token, and publishes no build artifact.
    if: >-
      github.event_name == 'push' &&
      github.repository == 'HamdiSouissi/PRIME-CRM' &&
      github.ref == 'refs/heads/arena/a18b007f-prime-crm' &&
      contains(github.event.head_commit.message, '[frontend preview]')
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: prime-crm-production-frontend-preview
      cancel-in-progress: false
    environment:
      name: production-frontend
      # This is a rehearsal, not a production deployment.
      deployment: false
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Ensure the checkout is the tested commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Compare the Alembic fingerprint with the frontend baseline
        env:
          EXPECTED_ALEMBIC_FINGERPRINT: ${{ vars.PRODUCTION_ALEMBIC_FINGERPRINT }}
        run: |
          if [ -z "$EXPECTED_ALEMBIC_FINGERPRINT" ]; then
            echo '::error::PRODUCTION_ALEMBIC_FINGERPRINT is missing from the production-frontend configuration.'
            exit 1
          fi
          python tools/migration_fingerprint.py verify --commit "$GITHUB_SHA" --expected "$EXPECTED_ALEMBIC_FINGERPRINT"

      - name: Ensure the approved commit is still the branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch_head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/arena/a18b007f-prime-crm" --jq '.object.sha')"
          if [ "$branch_head" != "$GITHUB_SHA" ]; then
            echo '::error::The branch changed after this run started; nothing was published.'
            exit 1
          fi

      - name: Rebuild and test the frontend in an isolated container
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ "$VITE_API_URL" != 'https://prime-crm-cqi3.onrender.com' ]; then
            echo '::error::VITE_API_URL is not the expected public API origin.'
            exit 1
          fi
          docker build --target verified-static \
            --build-arg "VITE_API_URL=$VITE_API_URL" \
            --tag prime-crm-frontend:release-verify frontend
          container="$(docker create prime-crm-frontend:release-verify)"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          mkdir -p "$RUNNER_TEMP/frontend-release"
          docker cp "$container:/app/dist/." "$RUNNER_TEMP/frontend-release/"

      - name: Validate and package the static build without publishing
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          python -m tools.frontend_release \
            --dist "$RUNNER_TEMP/frontend-release" \
            --output "$RUNNER_TEMP/frontend-release.zip" \
            --commit "$GITHUB_SHA" --api-origin "$VITE_API_URL"
          python -m zipfile -t "$RUNNER_TEMP/frontend-release.zip"
          echo 'Rehearsal only: no request to Netlify was made.'

  netlify_readonly_preview:
    name: Netlify · vérification en lecture seule sans publication
    # Explicit rehearsal only: the only Netlify requests are GETs. It never
    # creates a deploy, changes project settings, or publishes an artifact.
    if: >-
      github.event_name == 'push' &&
      github.repository == 'HamdiSouissi/PRIME-CRM' &&
      github.ref == 'refs/heads/arena/a18b007f-prime-crm' &&
      contains(github.event.head_commit.message, '[netlify preflight]')
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: prime-crm-netlify-readonly-preview
      cancel-in-progress: false
    environment:
      name: production-frontend
      deployment: false
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Ensure the checkout is the tested commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Compare the Alembic fingerprint with the frontend baseline
        env:
          EXPECTED_ALEMBIC_FINGERPRINT: ${{ vars.PRODUCTION_ALEMBIC_FINGERPRINT }}
        run: |
          if [ -z "$EXPECTED_ALEMBIC_FINGERPRINT" ]; then
            echo '::error::PRODUCTION_ALEMBIC_FINGERPRINT is missing from the production-frontend configuration.'
            exit 1
          fi
          python tools/migration_fingerprint.py verify --commit "$GITHUB_SHA" --expected "$EXPECTED_ALEMBIC_FINGERPRINT"

      - name: Ensure the approved commit is still the branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch_head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/arena/a18b007f-prime-crm" --jq '.object.sha')"
          if [ "$branch_head" != "$GITHUB_SHA" ]; then
            echo '::error::The branch changed after this run started; no Netlify request was made.'
            exit 1
          fi

      - name: Check the Netlify project and private login without publishing
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: python -m tools.netlify_preflight

  request_render_deploy:
    name: Render · demande de déploiement après approbation
    # Never deploy PRs, other branches, or forks. The environment additionally
    # requires an authorized human to approve before any step receives secrets.
    # An explicit marker skips only the Render request, not the CI tests.
    if: >-
      github.event_name == 'push' &&
      github.repository == 'HamdiSouissi/PRIME-CRM' &&
      github.ref == 'refs/heads/arena/a18b007f-prime-crm' &&
      !contains(github.event.head_commit.message, '[skip render]')
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: prime-crm-production-backend-request
      cancel-in-progress: false
    environment:
      name: production
      # A successful hook request does not prove the deploy is Live. Do not
      # create a misleading GitHub production-deployment status.
      deployment: false
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Ensure the checkout is the tested commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Compare the Alembic fingerprint with the recorded baseline
        env:
          EXPECTED_ALEMBIC_FINGERPRINT: ${{ vars.PRODUCTION_ALEMBIC_FINGERPRINT }}
        run: |
          if [ -z "$EXPECTED_ALEMBIC_FINGERPRINT" ]; then
            echo '::error::PRODUCTION_ALEMBIC_FINGERPRINT is missing from the production configuration.'
            exit 1
          fi
          python tools/migration_fingerprint.py verify --commit "$GITHUB_SHA" --expected "$EXPECTED_ALEMBIC_FINGERPRINT"

      - name: Check Render hook format offline
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: python tools/render_hook_check.py

      - name: Ensure the approved commit is still the branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch_head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/arena/a18b007f-prime-crm" --jq '.object.sha')"
          if [ "$branch_head" != "$GITHUB_SHA" ]; then
            echo '::error::The branch changed after this run started; no deploy request was sent.'
            exit 1
          fi

      - name: Request a Render deploy of the tested commit
        # One POST only. Acceptance is not proof that Render is Live; inspect
        # the exact commit and deploy result on Render before releasing again.
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: python -m tools.render_deploy
