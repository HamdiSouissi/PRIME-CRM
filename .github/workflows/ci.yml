name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# No deployment or repository-write permissions are needed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · Python 3.11 / PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: primecrm_ci
          POSTGRES_USER: ci
          # Disposable container credential, not an application secret.
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U ci -d primecrm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Lint Python
        run: python -m ruff check app alembic

      - name: Test backend (SQLite)
        env:
          DATABASE_URL: 'sqlite:///:memory:'
        run: python -m pytest -q app/tests

      - name: Compile Python
        run: python -m compileall -q app alembic

      - name: Test migrations on disposable PostgreSQL
        # This URL always points to the service container above, never Neon.
        env:
          DATABASE_URL: postgresql://ci:ci-only-password@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/primecrm_ci
        run: |
          # Use the installed CLI: backend/alembic shadows python -m alembic.
          alembic upgrade head
          alembic upgrade head
          alembic check
          # Destructive: this database is discarded at the end of the job.
          alembic downgrade base
          alembic upgrade head
          alembic check

      - name: Build backend Docker image
        # Build only: the image stays on the runner and is never pushed.
        run: docker build --tag prime-crm-backend:ci .

  frontend:
    name: Frontend · Node.js 24
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm run test -- --run

      - name: Type-check and build frontend
        run: npm run build
