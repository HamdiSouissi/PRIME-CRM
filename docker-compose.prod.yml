
services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
      POSTGRES_DB: ${POSTGRES_DB:-primecrm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-primecrm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prime-net

  backend:
    build: ./backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      # Choose only after verifying the real ingress and trusted proxy boundary.
      CLIENT_IP_MODE: ${CLIENT_IP_MODE:?Set CLIENT_IP_MODE after verifying the ingress}
      CLIENT_IP_PROXY_HEADER: ${CLIENT_IP_PROXY_HEADER:-}
      CLIENT_IP_TRUSTED_PROXIES: ${CLIENT_IP_TRUSTED_PROXIES:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in the environment}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}@db:5432/${POSTGRES_DB:-primecrm}
      REDIS_URL: ${REDIS_URL:?Set an authenticated rediss URL in the environment}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the environment}
      FIRST_SUPERUSER_EMAIL: ${FIRST_SUPERUSER_EMAIL:-}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:-}
      FIRST_COMPANY_NAME: ${FIRST_COMPANY_NAME:-Prime Vision Solutions}
      ALLOW_PUBLIC_REGISTRATION: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      AI_ALLOWED_ORIGINS: ${AI_ALLOWED_ORIGINS:-}
      AI_ALLOW_LOCAL_OLLAMA: "false"
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - prime-net
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: sh -c "alembic upgrade head && python -m app.bootstrap && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --no-proxy-headers"

  frontend:
    build: ./frontend
    restart: always
    depends_on:
      - backend
    networks:
      - prime-net

volumes:
  pgdata:
  backend_uploads:

networks:
  prime-net:
